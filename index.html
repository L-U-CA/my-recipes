<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recipe Vault - Personal Cookbook</title>
  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
    }
    .glass-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-nav {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .gradient-text {
      background: linear-gradient(135deg, #f97316 0%, #fb923c 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
  </style>
</head>
<body class="min-h-screen pb-20 selection:bg-orange-500 selection:text-white">

  <!-- Navigation Bar -->
  <header class="sticky top-0 z-40 glass-nav transition-all duration-300">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        
        <!-- Logo -->
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-orange-600 to-amber-500 flex items-center justify-center shadow-lg shadow-orange-500/20">
            <i data-lucide="utensils-crossed" class="w-5 h-5 text-white"></i>
          </div>
          <div>
            <h1 class="font-bold text-lg tracking-tight leading-none text-white">Recipe Vault</h1>
            <p class="text-xs text-slate-400">Personal Culinary Collection</p>
          </div>
        </div>

        <!-- Controls -->
        <div class="flex items-center gap-2 sm:gap-3">
          <button onclick="exportData()" title="Backup Recipes" class="p-2 sm:px-3 sm:py-2 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-300 hover:text-white border border-slate-700/50 transition flex items-center gap-2 text-sm">
            <i data-lucide="download" class="w-4 h-4"></i>
            <span class="hidden sm:inline">Export</span>
          </button>
          
          <label class="p-2 sm:px-3 sm:py-2 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-300 hover:text-white border border-slate-700/50 transition flex items-center gap-2 text-sm cursor-pointer">
            <i data-lucide="upload" class="w-4 h-4"></i>
            <span class="hidden sm:inline">Import</span>
            <input type="file" id="import-file" class="hidden" accept=".json" onchange="importData(event)">
          </label>

          <button onclick="openModal()" class="px-4 py-2 rounded-xl bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 text-white font-medium text-sm shadow-lg shadow-orange-500/25 transition flex items-center gap-2">
            <i data-lucide="plus" class="w-4 h-4"></i>
            <span>Add Recipe</span>
          </button>
        </div>

      </div>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-8">

    <!-- Search & Filters Header -->
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
      
      <!-- Search Input -->
      <div class="relative flex-1 max-w-lg">
        <i data-lucide="search" class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
        <input type="text" id="search-input" oninput="renderRecipes()" placeholder="Search recipes, tags, or ingredients..." 
          class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-slate-800/80 border border-slate-700/60 text-sm text-slate-200 placeholder-slate-400 focus:outline-none focus:border-orange-500/60 focus:ring-1 focus:ring-orange-500/60 transition">
      </div>

      <!-- Tag Filter Badges -->
      <div id="category-filters" class="flex items-center gap-2 overflow-x-auto pb-2 md:pb-0 scrollbar-none">
        <!-- Categories injected via JS -->
      </div>
    </div>

    <!-- Recipe Grid -->
    <div id="recipe-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Recipes rendered dynamically -->
    </div>

    <!-- Empty State -->
    <div id="empty-state" class="hidden text-center py-20 px-4">
      <div class="w-16 h-16 rounded-2xl bg-slate-800/80 border border-slate-700/60 flex items-center justify-center mx-auto mb-4 text-slate-500">
        <i data-lucide="cooking-pot" class="w-8 h-8"></i>
      </div>
      <h3 class="text-lg font-semibold text-slate-200 mb-1">No recipes found</h3>
      <p class="text-sm text-slate-400 max-w-sm mx-auto mb-6">Start building your culinary collection by adding your favorite home-cooked meals.</p>
      <button onclick="openModal()" class="px-4 py-2 rounded-xl bg-orange-500 hover:bg-orange-600 text-white font-medium text-sm transition inline-flex items-center gap-2">
        <i data-lucide="plus" class="w-4 h-4"></i> Add First Recipe
      </button>
    </div>

  </main>

  <!-- View Recipe Modal -->
  <div id="view-modal" class="fixed inset-0 z-50 hidden bg-slate-950/80 backdrop-blur-md overflow-y-auto flex items-center justify-center p-4">
    <div class="glass-card w-full max-w-3xl rounded-2xl overflow-hidden shadow-2xl relative my-8 border border-slate-700/60 max-h-[90vh] flex flex-col">
      
      <!-- Close Button -->
      <button onclick="closeViewModal()" class="absolute top-4 right-4 z-10 w-9 h-9 rounded-full bg-slate-900/60 hover:bg-slate-900 text-slate-300 hover:text-white backdrop-blur-md border border-white/10 flex items-center justify-center transition">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>

      <!-- Scrollable Modal Content -->
      <div class="overflow-y-auto flex-1">
        <div id="view-modal-hero" class="relative h-64 sm:h-80 w-full bg-slate-800">
          <img id="view-image" src="" class="w-full h-full object-cover" alt="Recipe preview">
          <div class="absolute inset-0 bg-gradient-to-t from-slate-900 via-slate-900/30 to-transparent"></div>
          <div class="absolute bottom-6 left-6 right-6">
            <div class="flex items-center gap-2 mb-2">
              <span id="view-category" class="px-2.5 py-1 rounded-md text-xs font-semibold bg-orange-500/80 text-white uppercase tracking-wider backdrop-blur-sm"></span>
            </div>
            <h2 id="view-title" class="text-2xl sm:text-3xl font-bold text-white tracking-tight"></h2>
          </div>
        </div>

        <div class="p-6 sm:p-8 space-y-6">
          <!-- Meta Info Bar -->
          <div class="grid grid-cols-3 gap-4 p-4 rounded-xl bg-slate-800/50 border border-slate-700/50 text-center">
            <div>
              <div class="text-xs text-slate-400 uppercase tracking-wider mb-0.5">Prep Time</div>
              <div id="view-prep" class="font-medium text-slate-200"></div>
            </div>
            <div class="border-x border-slate-700/50">
              <div class="text-xs text-slate-400 uppercase tracking-wider mb-0.5">Cook Time</div>
              <div id="view-cook" class="font-medium text-slate-200"></div>
            </div>
            <div>
              <div class="text-xs text-slate-400 uppercase tracking-wider mb-0.5">Servings</div>
              <div id="view-servings" class="font-medium text-slate-200"></div>
            </div>
          </div>

          <!-- Description -->
          <p id="view-description" class="text-slate-300 text-sm leading-relaxed"></p>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-8 pt-4 border-t border-slate-800">
            <!-- Ingredients -->
            <div>
              <h3 class="text-base font-semibold text-white mb-3 flex items-center gap-2">
                <i data-lucide="list-checks" class="w-4 h-4 text-orange-400"></i> Ingredients
              </h3>
              <div id="view-ingredients" class="space-y-2"></div>
            </div>

            <!-- Instructions -->
            <div>
              <h3 class="text-base font-semibold text-white mb-3 flex items-center gap-2">
                <i data-lucide="chef-hat" class="w-4 h-4 text-orange-400"></i> Instructions
              </h3>
              <ol id="view-instructions" class="space-y-3 text-sm text-slate-300 list-decimal list-inside"></ol>
            </div>
          </div>
        </div>
      </div>

      <!-- Action Footer -->
      <div class="p-4 bg-slate-900/80 border-t border-slate-800 flex justify-between items-center">
        <button id="view-delete-btn" class="px-3 py-1.5 rounded-lg bg-red-500/10 hover:bg-red-500/20 text-red-400 text-xs font-medium border border-red-500/20 transition flex items-center gap-1.5">
          <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> Delete
        </button>
        <button id="view-edit-btn" class="px-4 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium border border-slate-700 transition flex items-center gap-1.5">
          <i data-lucide="edit-3" class="w-3.5 h-3.5"></i> Edit Recipe
        </button>
      </div>

    </div>
  </div>

  <!-- Add/Edit Recipe Modal -->
  <div id="modal" class="fixed inset-0 z-50 hidden bg-slate-950/80 backdrop-blur-md overflow-y-auto flex items-center justify-center p-4">
    <div class="glass-card w-full max-w-2xl rounded-2xl overflow-hidden shadow-2xl relative my-8 border border-slate-700/60 p-6 sm:p-8">
      
      <div class="flex items-center justify-between pb-4 border-b border-slate-800 mb-6">
        <h2 id="modal-title" class="text-xl font-bold text-white">Add New Recipe</h2>
        <button onclick="closeModal()" class="text-slate-400 hover:text-white transition">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="recipe-form" onsubmit="saveRecipe(event)" class="space-y-4">
        <input type="hidden" id="recipe-id">

        <div>
          <label class="block text-xs font-medium text-slate-300 uppercase tracking-wider mb-1">Recipe Title *</label>
          <input type="text" id="form-title" required placeholder="e.g. Garlic Butter Creamy Pasta" 
            class="w-full px-3.5 py-2 rounded-xl bg-slate-900/80 border border-slate-700/70 text-sm text-slate-200 focus:outline-none focus:border-orange-500">
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-medium text-slate-300 uppercase tracking-wider mb-1">Category</label>
            <input type="text" id="form-category" placeholder="Dinner, Dessert, Italian..." 
              class="w-full px-3.5 py-2 rounded-xl bg-slate-900/80 border border-slate-700/70 text-sm text-slate-200 focus:outline-none focus:border-orange-500">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-300 uppercase tracking-wider mb-1">Image URL</label>
            <input type="url" id="form-image" placeholder="https://images.unsplash.com/..." 
              class="w-full px-3.5 py-2 rounded-xl bg-slate-900/80 border border-slate-700/70 text-sm text-slate-200 focus:outline-none focus:border-orange-500">
          </div>
        </div>

        <div class="grid grid-cols-3 gap-4">
          <div>
            <label class="block text-xs font-medium text-slate-300 uppercase tracking-wider mb-1">Prep Time</label>
            <input type="text" id="form-prep" placeholder="15 mins" 
              class="w-full px-3.5 py-2 rounded-xl bg-slate-900/80 border border-slate-700/70 text-sm text-slate-200 focus:outline-none focus:border-orange-500">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-300 uppercase tracking-wider mb-1">Cook Time</label>
            <input type="text" id="form-cook" placeholder="25 mins" 
              class="w-full px-3.5 py-2 rounded-xl bg-slate-900/80 border border-slate-700/70 text-sm text-slate-200 focus:outline-none focus:border-orange-500">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-300 uppercase tracking-wider mb-1">Servings</label>
            <input type="text" id="form-servings" placeholder="4 servings" 
              class="w-full px-3.5 py-2 rounded-xl bg-slate-900/80 border border-slate-700/70 text-sm text-slate-200 focus:outline-none focus:border-orange-500">
          </div>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-300 uppercase tracking-wider mb-1">Short Description</label>
          <textarea id="form-description" rows="2" placeholder="Brief summary of the dish..." 
            class="w-full px-3.5 py-2 rounded-xl bg-slate-900/80 border border-slate-700/70 text-sm text-slate-200 focus:outline-none focus:border-orange-500"></textarea>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-300 uppercase tracking-wider mb-1">Ingredients (one per line)</label>
          <textarea id="form-ingredients" rows="4" placeholder="200g Fettuccine&#10;2 tbsp Olive Oil&#10;3 cloves Garlic, minced" 
            class="w-full px-3.5 py-2 rounded-xl bg-slate-900/80 border border-slate-700/70 text-sm text-slate-200 focus:outline-none focus:border-orange-500"></textarea>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-300 uppercase tracking-wider mb-1">Instructions (one step per line)</label>
          <textarea id="form-instructions" rows="4" placeholder="Boil pasta in salted water until al dente.&#10;Sauté minced garlic in olive oil on medium heat." 
            class="w-full px-3.5 py-2 rounded-xl bg-slate-900/80 border border-slate-700/70 text-sm text-slate-200 focus:outline-none focus:border-orange-500"></textarea>
        </div>

        <div class="flex justify-end gap-3 pt-4 border-t border-slate-800">
          <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium text-sm transition">Cancel</button>
          <button type="submit" class="px-5 py-2 rounded-xl bg-orange-500 hover:bg-orange-600 text-white font-medium text-sm transition shadow-lg shadow-orange-500/20">Save Recipe</button>
        </div>
      </form>

    </div>
  </div>

  <!-- JavaScript Logic -->
  <script>
    // Initial sample datasets with rich imagery
    const INITIAL_RECIPES = [
      {
        id: "rec_1",
        title: "Garlic Butter Parmesan Pasta",
        category: "Dinner",
        image: "https://images.unsplash.com/photo-1621996346565-e3d5d6288334?auto=format&fit=crop&q=80&w=800",
        prepTime: "10 mins",
        cookTime: "15 mins",
        servings: "2-3",
        description: "A rich, silky garlic butter pasta tossed with freshly grated parmesan and parsley.",
        ingredients: [
          "250g Fettuccine or Spaghetti",
          "4 tbsp Unsalted Butter",
          "4 cloves Garlic, finely minced",
          "1/2 cup Heavy Cream",
          "3/4 cup Freshly Grated Parmesan",
          "Fresh Parsley & Black Pepper"
        ],
        instructions: [
          "Bring a large pot of salted water to a boil and cook pasta according to package directions.",
          "Melt butter in a skillet over medium-low heat. Add minced garlic and cook for 1-2 minutes until fragrant.",
          "Pour in heavy cream and simmer lightly for 2 minutes.",
          "Add cooked pasta directly into the sauce along with 1/4 cup pasta water.",
          "Stir in parmesan cheese until melted and smooth. Season with black pepper and fresh parsley."
        ]
      },
      {
        id: "rec_2",
        title: "Artisanal Avocado Toast",
        category: "Breakfast",
        image: "https://images.unsplash.com/photo-1525351484163-7529414344d8?auto=format&fit=crop&q=80&w=800",
        prepTime: "5 mins",
        cookTime: "5 mins",
        servings: "1",
        description: "Crispy thick-cut sourdough topped with mashed ripe avocado, red pepper flakes, and a poached egg.",
        ingredients: [
          "1 thick slice Sourdough Bread",
          "1 ripe Avocado",
          "1 Fresh Egg",
          "1/2 tsp Everything Bagel Seasoning",
          "Pinch of Red Pepper Flakes",
          "Drizzle of Extra Virgin Olive Oil"
        ],
        instructions: [
          "Toast the sourdough slice until golden and crispy.",
          "Mash ripe avocado with lemon juice, salt, and pepper in a small bowl.",
          "Poach or fry the egg to your liking.",
          "Spread mashed avocado generously over the toast, top with the egg, and sprinkle with seasonings."
        ]
      },
      {
        id: "rec_3",
        title: "Classic Berry Smoothie Bowl",
        category: "Breakfast",
        image: "https://images.unsplash.com/photo-1590301157890-4810ed352733?auto=format&fit=crop&q=80&w=800",
        prepTime: "5 mins",
        cookTime: "0 mins",
        servings: "1",
        description: "Thick and creamy frozen berry bowl topped with granola, chia seeds, and sliced banana.",
        ingredients: [
          "1 cup Frozen Mixed Berries",
          "1 Frozen Banana",
          "1/4 cup Almond Milk",
          "1 tbsp Chia Seeds",
          "Granola & Fresh Fruit for topping"
        ],
        instructions: [
          "Blend frozen berries, frozen banana, and almond milk on high until smooth and thick.",
          "Pour into a chilled bowl.",
          "Top arranged neatly with granola, fresh banana slices, and chia seeds."
        ]
      }
    ];

    let recipes = [];
    let currentFilter = "All";

    // Initialize App
    document.addEventListener("DOMContentLoaded", () => {
      loadRecipes();
      renderFilters();
      renderRecipes();
      lucide.createIcons();
    });

    // LocalStorage Functions
    function loadRecipes() {
      const stored = localStorage.getItem("recipe_vault_data");
      if (stored) {
        try {
          recipes = JSON.parse(stored);
        } catch (e) {
          recipes = INITIAL_RECIPES;
        }
      } else {
        recipes = INITIAL_RECIPES;
        saveToStorage();
      }
    }

    function saveToStorage() {
      localStorage.setItem("recipe_vault_data", JSON.stringify(recipes));
    }

    // Render Filters
    function renderFilters() {
      const categories = ["All", ...new Set(recipes.map(r => r.category).filter(Boolean))];
      const container = document.getElementById("category-filters");
      
      container.innerHTML = categories.map(cat => `
        <button onclick="setFilter('${cat}')" 
          class="px-3.5 py-1.5 rounded-xl text-xs font-medium transition whitespace-nowrap ${
            currentFilter === cat 
              ? 'bg-orange-500 text-white shadow-md shadow-orange-500/20' 
              : 'bg-slate-800/80 text-slate-400 hover:text-slate-200 border border-slate-700/50'
          }">
          ${cat}
        </button>
      `).join('');
    }

    function setFilter(cat) {
      currentFilter = cat;
      renderFilters();
      renderRecipes();
    }

    // Render Recipe Grid
    function renderRecipes() {
      const query = document.getElementById("search-input").value.toLowerCase();
      const grid = document.getElementById("recipe-grid");
      const empty = document.getElementById("empty-state");

      const filtered = recipes.filter(r => {
        const matchesCat = currentFilter === "All" || r.category === currentFilter;
        const matchesQuery = r.title.toLowerCase().includes(query) ||
                             (r.category && r.category.toLowerCase().includes(query)) ||
                             r.ingredients.some(i => i.toLowerCase().includes(query));
        return matchesCat && matchesQuery;
      });

      if (filtered.length === 0) {
        grid.innerHTML = "";
        empty.classList.remove("hidden");
        return;
      }

      empty.classList.add("hidden");
      grid.innerHTML = filtered.map(r => `
        <div onclick="openViewModal('${r.id}')" class="glass-card rounded-2xl overflow-hidden group cursor-pointer hover:border-slate-600 transition-all duration-300 hover:-translate-y-1 flex flex-col">
          
          <!-- Image Header -->
          <div class="relative h-48 w-full overflow-hidden bg-slate-800">
            <img src="${r.image || 'https://images.unsplash.com/photo-1495521821757-a1efb6729352?auto=format&fit=crop&q=80&w=800'}" 
              alt="${r.title}" 
              class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
            <div class="absolute inset-0 bg-gradient-to-t from-slate-950/80 via-transparent to-transparent"></div>
            ${r.category ? `
              <span class="absolute top-3 left-3 px-2.5 py-1 rounded-lg text-[10px] font-bold tracking-wider uppercase bg-slate-900/80 text-orange-400 backdrop-blur-md border border-white/10">
                ${r.category}
              </span>
            ` : ''}
          </div>

          <!-- Content Body -->
          <div class="p-5 flex-1 flex flex-col justify-between">
            <div>
              <h3 class="text-base font-bold text-white group-hover:text-orange-400 transition tracking-tight mb-2">${r.title}</h3>
              <p class="text-xs text-slate-400 leading-relaxed line-clamp-2 mb-4">${r.description || 'No description provided.'}</p>
            </div>

            <!-- Footer Stats -->
            <div class="flex items-center gap-4 text-xs text-slate-400 pt-3 border-t border-slate-800/80">
              ${r.prepTime || r.cookTime ? `
                <div class="flex items-center gap-1.5">
                  <i data-lucide="clock" class="w-3.5 h-3.5 text-orange-400"></i>
                  <span>${r.cookTime || r.prepTime}</span>
                </div>
              ` : ''}
              ${r.servings ? `
                <div class="flex items-center gap-1.5">
                  <i data-lucide="users" class="w-3.5 h-3.5 text-orange-400"></i>
                  <span>${r.servings}</span>
                </div>
              ` : ''}
            </div>
          </div>

        </div>
      `).join('');

      lucide.createIcons();
    }

    // View Modal Logic
    function openViewModal(id) {
      const recipe = recipes.find(r => r.id === id);
      if (!recipe) return;

      document.getElementById("view-title").innerText = recipe.title;
      document.getElementById("view-category").innerText = recipe.category || "General";
      document.getElementById("view-image").src = recipe.image || "https://images.unsplash.com/photo-1495521821757-a1efb6729352?auto=format&fit=crop&q=80&w=800";
      document.getElementById("view-prep").innerText = recipe.prepTime || "N/A";
      document.getElementById("view-cook").innerText = recipe.cookTime || "N/A";
      document.getElementById("view-servings").innerText = recipe.servings || "N/A";
      document.getElementById("view-description").innerText = recipe.description || "";

      // Ingredients Checkboxes
      const ingList = document.getElementById("view-ingredients");
      ingList.innerHTML = recipe.ingredients.map((ing, i) => `
        <label class="flex items-start gap-3 p-2 rounded-lg hover:bg-slate-800/50 cursor-pointer transition text-xs text-slate-300">
          <input type="checkbox" class="mt-0.5 rounded border-slate-700 text-orange-500 focus:ring-0 bg-slate-900">
          <span>${ing}</span>
        </label>
      `).join('');

      // Instructions
      const instList = document.getElementById("view-instructions");
      instList.innerHTML = recipe.instructions.map(inst => `
        <li class="pl-1 leading-relaxed">${inst}</li>
      `).join('');

      // Actions
      document.getElementById("view-edit-btn").onclick = () => { closeViewModal(); openModal(recipe.id); };
      document.getElementById("view-delete-btn").onclick = () => deleteRecipe(recipe.id);

      document.getElementById("view-modal").classList.remove("hidden");
    }

    function closeViewModal() {
      document.getElementById("view-modal").classList.add("hidden");
    }

    // Add/Edit Modal
    function openModal(id = null) {
      const modal = document.getElementById("modal");
      const form = document.getElementById("recipe-form");
      
      if (id) {
        const r = recipes.find(item => item.id === id);
        if (!r) return;
        document.getElementById("modal-title").innerText = "Edit Recipe";
        document.getElementById("recipe-id").value = r.id;
        document.getElementById("form-title").value = r.title;
        document.getElementById("form-category").value = r.category || "";
        document.getElementById("form-image").value = r.image || "";
        document.getElementById("form-prep").value = r.prepTime || "";
        document.getElementById("form-cook").value = r.cookTime || "";
        document.getElementById("form-servings").value = r.servings || "";
        document.getElementById("form-description").value = r.description || "";
        document.getElementById("form-ingredients").value = r.ingredients.join("\n");
        document.getElementById("form-instructions").value = r.instructions.join("\n");
      } else {
        document.getElementById("modal-title").innerText = "Add New Recipe";
        form.reset();
        document.getElementById("recipe-id").value = "";
      }

      modal.classList.remove("hidden");
    }

    function closeModal() {
      document.getElementById("modal").classList.add("hidden");
    }

    // Form Submit
    function saveRecipe(e) {
      e.preventDefault();
      const id = document.getElementById("recipe-id").value;
      const title = document.getElementById("form-title").value.trim();
      const category = document.getElementById("form-category").value.trim();
      const image = document.getElementById("form-image").value.trim();
      const prepTime = document.getElementById("form-prep").value.trim();
      const cookTime = document.getElementById("form-cook").value.trim();
      const servings = document.getElementById("form-servings").value.trim();
      const description = document.getElementById("form-description").value.trim();
      
      const ingredients = document.getElementById("form-ingredients").value
        .split("\n").map(s => s.trim()).filter(Boolean);
      const instructions = document.getElementById("form-instructions").value
        .split("\n").map(s => s.trim()).filter(Boolean);

      if (id) {
        const index = recipes.findIndex(r => r.id === id);
        if (index !== -1) {
          recipes[index] = { id, title, category, image, prepTime, cookTime, servings, description, ingredients, instructions };
        }
      } else {
        const newRecipe = {
          id: "rec_" + Date.now(),
          title, category, image, prepTime, cookTime, servings, description, ingredients, instructions
        };
        recipes.unshift(newRecipe);
      }

      saveToStorage();
      renderFilters();
      renderRecipes();
      closeModal();
    }

    function deleteRecipe(id) {
      if (confirm("Are you sure you want to delete this recipe?")) {
        recipes = recipes.filter(r => r.id !== id);
        saveToStorage();
        renderFilters();
        renderRecipes();
        closeViewModal();
      }
    }

    // Export/Import JSON
    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(recipes, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `recipe_vault_backup.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function importData(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        try {
          const imported = JSON.parse(event.target.result);
          if (Array.isArray(imported)) {
            recipes = imported;
            saveToStorage();
            renderFilters();
            renderRecipes();
            alert("Recipes imported successfully!");
          } else {
            alert("Invalid backup file format.");
          }
        } catch (err) {
          alert("Error parsing backup file.");
        }
      };
      reader.readAsText(file);
    }
  </script>
</body>
</html>
